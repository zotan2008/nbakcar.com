<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBAKCAR - Factory Showroom</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<meta name="description" content="NBAKCAR Factory Showroom - Product Display & Inquiry.">
<link rel="stylesheet" href="css/style.css">
<style>
:root{--main:#c8102e;--dark:#1a1a1a;--gray:#888888;--bg:#f5f5f5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--dark);background:#fff;line-height:1.6}
a{color:inherit;text-decoration:none}

/* 顶部 */
.header{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;letter-spacing:1px;color:var(--main);white-space:nowrap;cursor:pointer}
.logo span{color:var(--dark)}
.search-wrap{flex:1;min-width:150px;display:flex;justify-content:flex-end}
#header-search{width:100%;max-width:240px;padding:8px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none}
#header-search:focus{border-color:var(--main)}
.lang-switch{padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-weight:600;background:#fff;cursor:pointer;outline:none}

/* 菜单栏 */
.nav-menu{display:flex;gap:6px;order:3;width:100%;border-top:1px solid #f0f0f0;padding-top:8px;flex-wrap:wrap;align-items:center}
.nav-link{padding:6px 16px;font-size:14px;font-weight:600;color:var(--gray);border-radius:6px;cursor:pointer;transition:.2s;white-space:nowrap}
.nav-link:hover{color:var(--main);background:var(--bg)}
.nav-link.active{color:#fff;background:var(--main)}

/* 联系我们下拉 */
.contact-dropdown{position:relative;margin-left:auto}
.contact-panel{display:none;position:absolute;top:100%;right:0;margin-top:8px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px 16px;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:30}
.contact-panel.show{display:block}
.contact-panel p{font-size:13px;padding:6px 0;border-bottom:1px dashed #eee}
.contact-panel p:last-child{border-bottom:none}

/* 内容区 */
main{padding:22px 28px 10px}
.view-page{display:none}
.view-page.active{display:block}
.section-title{font-size:18px;font-weight:700;margin-bottom:14px}

/* 产品网格 */
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:900px){.product-grid{grid-template-columns:repeat(2,1fr)}}
.next-page-wrap{display:flex;justify-content:center;margin-top:24px}
.next-page-btn{padding:10px 32px;border:1px solid var(--main);border-radius:8px;background:#fff;color:var(--main);font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.next-page-btn:hover{background:var(--main);color:#fff}
.next-page-btn:disabled{border-color:#ddd;color:#bbb;cursor:not-allowed;background:#fafafa}
.product-card{background:#fff;border:1px solid #eee;border-radius:10px;overflow:hidden;transition:.2s;display:flex;flex-direction:column}
.product-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.product-card img.thumb{width:100%;aspect-ratio:3/4;object-fit:contain;padding:12px;background:var(--bg);display:block;cursor:zoom-in}
.product-info{padding:9px 12px 4px}
.product-title{font-size:13px;font-weight:600}
.video-slot{padding:6px 12px 12px}
.video-btn{width:100%;padding:7px 0;border:1px solid #ddd;border-radius:6px;background:#fff;font-size:12px;font-weight:600;color:var(--gray);cursor:pointer;transition:.2s}
.video-btn:hover{border-color:var(--main);color:var(--main)}
.no-result{grid-column:1/-1;text-align:center;color:var(--gray);padding:40px 0;display:none}

/* 灯箱 */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:100;justify-content:center;align-items:center;flex-direction:column}
.lightbox.show{display:flex}
.lightbox img{max-width:90vw;max-height:78vh;object-fit:contain}
.lb-close{position:absolute;top:14px;right:18px;font-size:30px;color:#fff;background:none;border:none;cursor:pointer;line-height:1}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;color:#fff;background:none;border:none;cursor:pointer;padding:10px 14px}
.lb-prev{left:8px}.lb-next{right:8px}
.lb-cap{color:#ddd;font-size:13px;margin-top:12px}

/* 页脚 */
.footer{margin-top:26px;padding:26px 28px;background:var(--dark);color:#bbb;font-size:13px;text-align:center}
.footer strong{color:#fff}
</style>
</head>
<body>

<header class="header">
  <div class="logo" data-go="home">NBA<span>KCAR</span></div>
  <div class="search-wrap">
    <input type="text" id="header-search"
           placeholder="Search products..."
           data-zh-placeholder="搜索产品..."
           data-en-placeholder="Search products..."
           data-es-placeholder="Buscar productos..."
           data-ja-placeholder="製品を検索..."
           data-ar-placeholder="ابحث عن المنتجات...">
  </div>
  <select id="lang-switch" class="lang-switch">
    <option value="zh">中文</option>
    <option value="en" selected>English</option>
    <option value="es">Español</option>
    <option value="ja">日本語</option>
    <option value="ar">العربية</option>
  </select>

  <nav class="nav-menu">
    <span class="nav-link active" data-go="home" data-zh="首页" data-en="Home" data-es="Inicio" data-ja="ホーム" data-ar="الرئيسية">Home</span>
    <span class="nav-link" data-go="products" data-zh="产品" data-en="Products" data-es="Productos" data-ja="製品" data-ar="المنتجات">Products</span>
    <span class="nav-link" data-go="factory" data-zh="工厂展示" data-en="Factory" data-es="Fábrica" data-ja="工場" data-ar="المصنع">Factory</span>
    <span class="nav-link contact-dropdown" id="contact-btn" data-zh="联系我们" data-en="Contact Us" data-es="Contáctanos" data-ja="お問い合わせ" data-ar="اتصل بنا">Contact Us</span>
    <div class="contact-panel" id="contact-panel">
      <p>📞 <span data-zh="电话" data-en="Phone" data-es="Teléfono" data-ja="電話" data-ar="هاتف">Phone</span>：<span data-zh="待添加" data-en="To be added" data-es="Por añadir" data-ja="未追加" data-ar="سيُضاف">To be added</span></p>
      <p>💬 WhatsApp：<span data-zh="待添加" data-en="To be added" data-es="Por añadir" data-ja="未追加" data-ar="سيُضاف">To be added</span></p>
    </div>
  </nav>
</header>

<main>

  <!-- 首页 -->
  <section class="view-page active" id="view-home">
    <h2 class="section-title" data-zh="产品展示" data-en="Featured Products" data-es="Productos destacados" data-ja="製品紹介" data-ar="المنتجات المميزة">Featured Products</h2>
    <div class="product-grid" id="home-grid"></div>
    <div class="next-page-wrap">
      <button class="next-page-btn" id="next-home" type="button" data-zh="下一页" data-en="Next Page" data-es="Siguiente" data-ja="次のページ" data-ar="الصفحة التالية">Next Page</button>
    </div>
  </section>

  <!-- 产品 -->
  <section class="view-page" id="view-products">
    <h2 class="section-title" data-zh="全部产品" data-en="All Products" data-es="Todos los productos" data-ja="全製品" data-ar="جميع المنتجات">All Products</h2>
    <div class="product-grid" id="product-grid"></div>
    <p class="no-result" id="no-result" data-zh="没有找到匹配的产品" data-en="No products found" data-es="No se encontraron productos" data-ja="該当する製品がありません" data-ar="لم يتم العثور على منتجات">No products found</p>
    <div class="next-page-wrap">
      <button class="next-page-btn" id="next-products" type="button" data-zh="下一页" data-en="Next Page" data-es="Siguiente" data-ja="次のページ" data-ar="الصفحة التالية">Next Page</button>
    </div>
  </section>

  <!-- 工厂展示 -->
  <section class="view-page" id="view-factory">
    <h2 class="section-title" data-zh="工厂展示" data-en="Factory Tour" data-es="Recorrido de fábrica" data-ja="工場紹介" data-ar="جولة في المصنع">Factory Tour</h2>
    <p style="color:var(--gray);font-size:14px" data-zh="工厂介绍内容待添加。" data-en="Factory information to be added." data-es="Información de fábrica por añadir." data-ja="工場情報は未追加です。" data-ar="معلومات المصنع ستُضاف.">Factory information to be added.</p>
  </section>

</main>

<footer class="footer">
  <p><strong>NBAKCAR</strong> · <span data-zh="工厂产品展厅" data-en="Factory Showroom" data-es="Showroom de fábrica" data-ja="工場製品展示場" data-ar="معرض منتجات المصنع">Factory Showroom</span> · <a href="mailto:info@nbakcar.com">info@nbakcar.com</a></p>
  <p style="margin-top:6px;opacity:.7">© NBAKCAR</p>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lb-close" type="button">✕</button>
  <button class="lb-nav lb-prev" id="lb-prev" type="button">‹</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-nav lb-next" id="lb-next" type="button">›</button>
  <div class="lb-cap" id="lb-cap"></div>
</div>

<script src="js/script.v3.js"></script>
</body>
</html>
