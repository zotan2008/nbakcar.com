<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBAKCAR · Factory Showroom</title>
<style>
  :root{
    --red:#c62828;
    --dark:#1a1a1a;
    --line:#e5e5e5;
    --muted:#888;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:#222;background:#fff;line-height:1.6}
  a{text-decoration:none;color:inherit}
  img{max-width:100%;display:block}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
  .header-inner{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .logo{font-size:24px;font-weight:800;letter-spacing:2px}
  .logo span{color:var(--red)}
  nav{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap}
  .nav-link{padding:7px 16px;border-radius:5px;font-size:14px;font-weight:600;background:transparent;color:#333;cursor:pointer;border:none;font-family:inherit}
  .nav-link:hover{background:#f2f2f2}
  .nav-link.active{background:var(--red);color:#fff}
  .header-right{display:flex;align-items:center;gap:10px;margin-left:auto}
  #header-search{width:170px;padding:7px 11px;border:1px solid var(--line);border-radius:5px;font-size:13px;font-family:inherit}
  #header-search:focus{outline:none;border-color:var(--red)}
  #lang-switch{padding:7px 8px;border:1px solid var(--line);border-radius:5px;font-size:13px;font-family:inherit;background:#fff;cursor:pointer}

  /* ---------- contact dropdown ---------- */
  .contact-wrap{position:relative}
  .contact-trigger{padding:7px 14px;border:1px solid var(--red);border-radius:5px;color:var(--red);font-size:13px;font-weight:600;cursor:pointer;background:#fff;font-family:inherit}
  .contact-panel{display:none;position:absolute;right:0;top:38px;width:220px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.1);padding:14px;z-index:60}
  .contact-panel.show{display:block}
  .contact-panel .cp-title{font-weight:700;font-size:13px;margin-bottom:8px;color:var(--red)}
  .contact-panel .cp-line{font-size:13px;padding:5px 0;color:#444}

  /* ---------- layout ---------- */
  main{max-width:1200px;margin:0 auto;padding:26px 20px 50px;min-height:55vh}
  .view-page{display:none}
  .view-page.active{display:block}
  .section-title{font-size:20px;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--red)}
  .placeholder{padding:60px 10px;text-align:center;color:var(--muted);font-size:15px}

  /* ---------- product grid (self-contained) ---------- */
  .product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  @media (max-width:900px){.product-grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:520px){.product-grid{grid-template-columns:1fr}}
  .product-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:pointer;transition:box-shadow .2s,transform .2s}
  .product-card:hover{box-shadow:0 6px 18px rgba(0,0,0,.12);transform:translateY(-2px)}
  .product-card .pc-img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fafafa}
  .product-info{padding:10px 12px}
  .product-title{font-size:14px;font-weight:600;text-align:center;min-height:20px}
  .video-btn{display:block;width:calc(100% - 24px);margin:0 12px 12px;padding:7px;border:1px solid var(--line);border-radius:5px;background:#fafafa;color:#555;font-size:12px;cursor:pointer;font-family:inherit}
  .video-btn:hover{background:#f0f0f0}

  .next-btn{display:block;margin:22px auto 0;padding:9px 28px;border:1px solid var(--red);border-radius:5px;background:#fff;color:var(--red);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .next-btn:disabled{border-color:#ccc;color:#aaa;cursor:default}

  /* ---------- footer ---------- */
  footer{background:var(--dark);color:#fff;padding:26px 20px;text-align:center;font-size:13px}
  footer .f-main{font-weight:700;letter-spacing:1px;margin-bottom:4px}
  footer .f-sub{color:#aaa;font-size:12px}

  /* ---------- lightbox ---------- */
  #lightbox{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);align-items:center;justify-content:center}
  #lightbox.show{display:flex}
  #lightbox img{max-width:92vw;max-height:86vh;object-fit:contain}
  .lb-btn{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border:none;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:20px;cursor:pointer;z-index:101}
  .lb-btn:hover{background:rgba(255,255,255,.32)}
  #lightbox-prev{left:18px}
  #lightbox-next{right:18px}
  #lightbox-close{position:fixed;top:18px;right:22px;width:38px;height:38px;border:none;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:18px;cursor:pointer;z-index:101}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">NBA<span>KCAR</span></div>
    <nav>
      <button class="nav-link active" data-nav="home" data-zh="首页" data-en="Home" data-es="Inicio" data-ja="ホーム" data-ar="الرئيسية">Home</button>
      <button class="nav-link" data-nav="products" data-zh="产品" data-en="Products" data-es="Productos" data-ja="製品" data-ar="المنتجات">Products</button>
      <button class="nav-link" data-nav="factory" data-zh="工厂展示" data-en="Factory" data-es="Fábrica" data-ja="工場" data-ar="المصنع">Factory</button>
    </nav>
    <div class="header-right">
      <input id="header-search" type="search" placeholder="Search products..."
             data-zh-placeholder="搜索产品" data-en-placeholder="Search products..."
             data-es-placeholder="Buscar productos" data-ja-placeholder="製品を検索" data-ar-placeholder="ابحث عن المنتجات">
      <select id="lang-switch">
        <option value="zh">中文</option>
        <option value="en" selected>English</option>
        <option value="es">Español</option>
        <option value="ja">日本語</option>
        <option value="ar">العربية</option>
      </select>
      <div class="contact-wrap">
        <button class="contact-trigger" data-zh="联系我们" data-en="Contact Us" data-es="Contáctanos" data-ja="お問い合わせ" data-ar="اتصل بنا">Contact Us</button>
        <div class="contact-panel" id="contact-panel">
          <div class="cp-title" data-zh="联系方式" data-en="Contact Info" data-es="Información" data-ja="連絡先" data-ar="معلومات الاتصال">Contact Info</div>
          <div class="cp-line" data-zh="📞 电话：待添加" data-en="📞 Phone: To be added" data-es="📞 Teléfono: Por agregar" data-ja="📞 電話：未追加" data-ar="📞 هاتف: سيتم إضافته">📞 Phone: To be added</div>
          <div class="cp-line" data-zh="💬 WhatsApp：待添加" data-en="💬 WhatsApp: To be added" data-es="💬 WhatsApp: Por agregar" data-ja="💬 WhatsApp：未追加" data-ar="💬 واتساب: سيتم إضافته">💬 WhatsApp: To be added</div>
          <div class="cp-line" data-zh="✉️ 邮箱：待添加" data-en="✉️ Email: To be added" data-es="✉️ Correo: Por agregar" data-ja="✉️ メール：未追加" data-ar="✉️ بريد: سيتم إضافته">✉️ Email: To be added</div>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="view-page active" id="view-home">
    <h2 class="section-title" data-zh="产品展示" data-en="Featured Products" data-es="Productos destacados" data-ja="製品紹介" data-ar="المنتجات المميزة">Featured Products</h2>
    <div class="product-grid" id="home-grid"></div>
    <button class="next-btn" id="next-home" data-zh="下一页" data-en="Next Page" data-es="Siguiente" data-ja="次のページ" data-ar="الصفحة التالية">Next Page</button>
  </section>

  <section class="view-page" id="view-products">
    <h2 class="section-title" data-zh="全部产品" data-en="All Products" data-es="Todos los productos" data-ja="全製品" data-ar="كل المنتجات">All Products</h2>
    <div class="product-grid" id="product-grid"></div>
    <button class="next-btn" id="next-products" data-zh="下一页" data-en="Next Page" data-es="Siguiente" data-ja="次のページ" data-ar="الصفحة التالية">Next Page</button>
  </section>

  <section class="view-page" id="view-factory">
    <h2 class="section-title" data-zh="工厂展示" data-en="Factory Tour" data-es="Visita a la fábrica" data-ja="工場紹介" data-ar="جولة في المصنع">Factory Tour</h2>
    <div class="placeholder" data-zh="工厂展示图片待添加" data-en="Factory information to be added." data-es="Información de la fábrica por agregar." data-ja="工場紹介画像を追加予定です。" data-ar="معلومات المصنع سيتم إضافتها.">Factory information to be added.</div>
  </section>
</main>

<footer>
  <div class="f-main" data-zh="NBAKCAR · 工厂产品展厅" data-en="NBAKCAR · Factory Showroom" data-es="NBAKCAR · Sala de exposición" data-ja="NBAKCAR · 工場ショールーム" data-ar="NBAKCAR · صالة العرض">NBAKCAR · Factory Showroom</div>
  <div class="f-sub">© NBAKCAR</div>
</footer>

<div id="lightbox">
  <button id="lightbox-close">✕</button>
  <button class="lb-btn" id="lightbox-prev">‹</button>
  <img id="lightbox-img" src="" alt="">
  <button class="lb-btn" id="lightbox-next">›</button>
</div>

<script src="js/script.v3.js"></script>
</body>
</html>
